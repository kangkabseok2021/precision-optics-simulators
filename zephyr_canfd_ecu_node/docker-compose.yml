version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    command: mosquitto -c /dev/null --listener 1883 --allow-anonymous true

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: ecu_gateway
    network_mode: host
    cap_add:
      - NET_ADMIN
    depends_on:
      - mosquitto
    command: ["vcan0", "tcp://localhost:1883", "8443", "cert.pem", "key.pem"]

volumes:
  mosquitto-data:
  mosquitto-log:
