name: Swarm Algorithms CI

on:
  push:
    paths:
      - 'uav_swarm_coordinator/**'
  pull_request:
    paths:
      - 'uav_swarm_coordinator/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-algorithms:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uav_swarm_coordinator

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            uav_swarm_coordinator/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('uav_swarm_coordinator/Cargo.lock') }}

      - name: cargo test
        run: cargo test --all

      - name: cargo clippy
        run: cargo clippy -- -D warnings

  aarch64-cross:
    name: cross-compile aarch64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uav_swarm_coordinator

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-linker
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cross-compile swarm_algorithms
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Verify ELF aarch64
        run: |
          file target/aarch64-unknown-linux-gnu/release/libswarm_algorithms.rlib
